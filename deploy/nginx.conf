# nginx server block for the WaBridge site (generated by build.mjs)
server {
  listen 443 ssl http2;
  server_name wabridge-app.vercel.app;
  root /var/www/wabridge-site;   # upload the dist/ folder here
  index index.html;
  server_tokens off;
  error_page 404 /404.html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://wabridge-app.vercel.app; form-action 'self' mailto:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://wabridge-app.vercel.app; form-action 'self' mailto:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; manifest-src 'self'; upgrade-insecure-requests" always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always; add_header Cross-Origin-Opener-Policy "same-origin" always; add_header Cross-Origin-Resource-Policy "same-origin" always; add_header X-Permitted-Cross-Domain-Policies "none" always; }
  location ~ /\.(?!well-known) { deny all; }
  location = /vercel.json { deny all; }
  location = /_headers { deny all; }
  gzip on; gzip_types text/css application/javascript image/svg+xml application/json;
}
